<style>

/* gallery page */
body {
  text-align: center;
  background-image: linear-gradient(to left, #bebebe 50%, #333333 50%);
    }

.gallery-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.gallery-container img {
  width: 100%;
  max-width: 300px;
  height: auto;
  border-radius: 10px;
  background-color: black;
  box-shadow: 5px 7px 3px black;
}

.container {
        display: flex;
        justify-content: center;
        font-size: 4rem;
        font-weight: bold;
        opacity: 0;
        transform: translateY(50px);
        transition: opacity 0.5s, transform 0.5s;
    }

    .letter {
        display: inline-block;
        opacity: 0;
        transform: translateY(50px);
        transition: opacity 0.5s ease-out, transform 0.5s ease-out;
    }

    /* Delays for each letter */
    .letter:nth-child(1) { transition-delay: 0.1s; }
    .letter:nth-child(2) { transition-delay: 0.2s; }
    .letter:nth-child(3) { transition-delay: 0.3s; }
    .letter:nth-child(4) { transition-delay: 0.4s; }
    .letter:nth-child(5) { transition-delay: 0.5s; }
    .letter:nth-child(6) { transition-delay: 0.6s; }
    .letter:nth-child(7) { transition-delay: 0.7s; }

    /* Animation on scroll */
    .container.show {
        opacity: 1;
        transform: translateY(0);
    }

    .container.show .letter {
        opacity: 1;
        transform: translateY(0);
    }



@media (max-width: 768px) {
  .gallery-container img {
    max-width: 200px;
  }
}

@media (max-width: 480px) {
  .gallery-container {
    flex-direction: column;
    align-items: center;
  }

  .gallery-container img {
    max-width: 90%;
  }
}

/* home btn */

.home-link {
            font-size: 18px;
            font-weight: bold;
        }

.Home-btn {
  right: 20px;
  background-color: #ff0000;
}

.floating-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: fixed;
  bottom: 20px;
  cursor: pointer;
  box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
  transition: all 0.3s ease;
}

/* home btn end */

/* video */
.gallery-container video {
  width: 100%;
  max-width: 550px;
  height: 100%;
  border-radius: 10px;
  background-color: black;
  box-shadow: 5px 7px 3px black;
}

@media (max-width: 768px) {
  .gallery-container video {
    max-width: 200px;
  }
}

@media (max-width: 480px) {
  .gallery-container video {
    max-width: 90%;
  }
}
/* video end */

/*end gallery page*/

</style>

<script>
  /* This small script only adds the class for animation when scrolling into view */
  const gallery = document.getElementById('gallery');

  const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
          if (entry.isIntersecting) {
              gallery.classList.add('show');
          }
      });
  }, { threshold: 0.5 });

  observer.observe(gallery);
</script>
